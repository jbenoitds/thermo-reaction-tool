name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Test
        run: pytest
      - name: Doctests in the package
        run: python -m pytest --doctest-modules --pyargs thermoreact
      - name: CLI smoke test
        run: thermoreact reaction "N2 + 3 H2 -> 2 NH3" -T 298.15 700 --crossover
